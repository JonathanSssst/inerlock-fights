<script>
(function () {
  'use strict';
  var D = window.LSF_TEAMS;
  if (!D || !D.teams) return;

  var teams = D.teams;
  var grid = document.getElementById('teamGrid');
  var stats = document.getElementById('teamStats');

  /* 统计 */
  var memberCount = 0;
  var schoolMap = {};
  teams.forEach(function (t) {
    memberCount += t.members.length;
    t.schools.forEach(function (s) { schoolMap[s] = 1; });
  });
  var schoolList = Object.keys(schoolMap);
  if (stats) {
    stats.innerHTML =
      '<div class="fact"><span>参赛队伍</span><b>' + teams.length + ' 支</b></div>' +
      '<div class="fact"><span>参赛选手</span><b>' + memberCount + ' 人</b></div>' +
      '<div class="fact"><span>覆盖学校</span><b>' + schoolList.length + ' 所</b></div>' +
      '<div class="fact"><span>比赛项目</span><b>4 项</b></div>';
  }

  /* 队伍卡片 */
  teams.forEach(function (t) {
    var card = document.createElement('article');
    card.className = 'team-card';
    card.setAttribute('data-team-id', String(t.id));
    card.setAttribute('data-schools', t.schools.join('|'));

    var top = document.createElement('div');
    top.className = 'team-top';
    var num = document.createElement('span');
    num.className = 'team-num';
    num.textContent = t.id;
    top.appendChild(num);

    var name = document.createElement('h3');
    name.className = 'team-name';
    name.textContent = t.name;
    top.appendChild(name);

    if (t.placeholder || t.captainTBD) {
      var tags = document.createElement('span');
      tags.className = 'team-tags';
      if (t.placeholder) {
        var tag = document.createElement('span');
        tag.className = 'team-tag';
        tag.textContent = '队名待定';
        tags.appendChild(tag);
      }
      if (t.captainTBD) {
        var ctag = document.createElement('span');
        ctag.className = 'team-tag is-tbd';
        ctag.textContent = '队长待定';
        tags.appendChild(ctag);
      }
      top.appendChild(tags);
    }
    card.appendChild(top);

    var schools = document.createElement('div');
    schools.className = 'team-schools';
    t.schools.forEach(function (s) {
      var st = document.createElement('span');
      st.className = 'school-tag';
      st.textContent = s;
      schools.appendChild(st);
    });
    card.appendChild(schools);

    var ul = document.createElement('ul');
    ul.className = 'roster';
    t.members.forEach(function (m) {
      var li = document.createElement('li');
      var cls = [];
      if (m.pending) cls.push('is-pending');
      if (m.captain) cls.push('is-captain');
      if (cls.length) li.className = cls.join(' ');
      li.textContent = m.mcid;
      if (m.captain) {
        var badge = document.createElement('b');
        badge.className = 'cap-badge';
        badge.textContent = '队长';
        li.appendChild(badge);
      }
      ul.appendChild(li);
    });
    card.appendChild(ul);

    var count = document.createElement('div');
    count.className = 'team-count';
    count.textContent = t.members.length + ' 名队员';
    card.appendChild(count);

    grid.appendChild(card);
  });
})();
</script>
