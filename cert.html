<script src="app.js?v=37"></script>
<script src="data/certs.js?v=37"></script>
<script>
(function () {
  'use strict';
  var D = window.LSF_CERTS;
  var input = document.getElementById('mcid');
  var btn = document.getElementById('claimBtn');
  var result = document.getElementById('result');
  if (!D || !input || !btn || !result) return;

  function claim() {
    var v = input.value.trim();
    if (!v) { result.innerHTML = '<p class="cert-err">请输入 MC ID。</p>'; return; }
    var hit = null;
    for (var i = 0; i < D.members.length; i++) {
      if (D.members[i].toLowerCase() === v.toLowerCase()) { hit = D.members[i]; break; }
    }
    if (!hit) {
      result.innerHTML = '<p class="cert-err">未找到该 MC ID。请确认是否为冠军队成员，或联系组委会核对。</p>';
      return;
    }
    var src = 'assets/cert-' + hit + '.png';
    result.innerHTML =
      '<img class="cert-img" src="' + src + '" alt="冠军奖状' + hit + '">' +
      '<div><a class="btn btn-primary" href="' + src + '" download="奖状-' + hit + '.png">下载奖状 →</a></div>';
  }
  btn.addEventListener('click', claim);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') claim(); });
})();
</script>
