<script src="app.js?v=42"></script>
<script src="data/certs.js?v=42"></script>
<script>
(function () {
  'use strict';
  var D = window.LSF_CERTS;
  var result = document.getElementById('result');
  var input = document.getElementById('mcid');
  var codeInput = document.getElementById('code');
  var btn = document.getElementById('claimBtn');
  if (!D || !result || !input || !btn) return;
  var members = D.members || {};

  function err(msg) { result.innerHTML = '<p class="cert-err">' + msg + '</p>'; }

  function claim() {
    var mcid = input.value.trim();
    var code = codeInput.value.trim();
    if (!mcid || !code) { err('请输入 MC ID 与认领码。'); return; }
    var key = null;
    for (var k in members) {
      if (k.toLowerCase() === mcid.toLowerCase()) { key = k; break; }
    }
    if (!key || String(members[key]).toUpperCase() !== code.toUpperCase()) {
      err('MC ID 或认领码不正确，请核对后重试。');
      return;
    }
    var solo = 'assets/cert-' + key + '.png';
    result.innerHTML =
      '<div class="cert-grid">' +
        '<figure class="cert-card">' +
          '<figcaption>团队奖状</figcaption>' +
          '<img src="assets/poster-cert.png" alt="团队奖状">' +
          '<a class="btn btn-primary" href="assets/poster-cert.png" download="奖状-因式分解喵喵喵-团队.png">下载团队奖状 →</a>' +
        '</figure>' +
        '<figure class="cert-card">' +
          '<figcaption>个人奖状</figcaption>' +
          '<img src="' + solo + '" alt="个人奖状">' +
          '<a class="btn btn-primary" href="' + solo + '" download="奖状-' + key + '.png">下载个人奖状 →</a>' +
        '</figure>' +
      '</div>';
  }
  btn.addEventListener('click', claim);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') claim(); });
  codeInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') claim(); });
})();
</script>
</body>
