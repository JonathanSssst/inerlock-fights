<script>
(function () {
  'use strict';
  var D = window.LSF_SCHEDULE;
  if (!D || !D.days) return;
  var root = document.getElementById('scheduleRoot');
  if (!root) return;
  var ph = D.placeholder || '比赛未开始';

  D.days.forEach(function (day) {
    var head = document.createElement('h3');
    head.className = 'sub-head';
    head.textContent = day.label + ' · ' + (day.title || '');
    root.appendChild(head);

    var wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    var table = document.createElement('table');
    table.className = 'schedule';

    var thead = document.createElement('thead');
    thead.innerHTML = '<tr><th>时间</th><th>项目</th><th>阶段</th><th>对阵</th><th>比分</th></tr>';
    table.appendChild(thead);

    var tbody = document.createElement('tbody');
    day.items.forEach(function (it) {
      var tr = document.createElement('tr');
      function cell(val, cls) {
        var td = document.createElement('td');
        td.textContent = val;
        if (cls) td.className = cls;
        return td;
      }
      tr.appendChild(cell(it.time));
      tr.appendChild(cell(it.project));
      tr.appendChild(cell(it.stage));
      tr.appendChild(cell(it.match, it.match === ph ? 'ph' : ''));
      tr.appendChild(cell(it.score, it.score === ph ? 'ph' : ''));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    root.appendChild(wrap);
  });
})();
</script>
